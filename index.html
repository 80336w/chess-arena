<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessMaster AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-100">
    <!-- 导航栏 -->
    <nav class="bg-slate-800 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-chess-knight mr-2"></i>ChessMaster AI</h1>
            <div class="space-x-4">
                <button onclick="app.resetGame()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded transition"><i class="fas fa-redo mr-1"></i> 新对局</button>
                <button onclick="app.toggleHistoryModal()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded transition"><i class="fas fa-history mr-1"></i> 战绩</button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container mx-auto p-4 flex-grow flex flex-col lg:flex-row gap-6 mt-4">
        
        <!-- 左侧：棋盘区域 -->
        <div class="lg:w-2/3 flex flex-col items-center">
            <div id="board" class="w-full max-w-[600px] board-container"></div>
            
            <!-- 状态栏 -->
            <div class="w-full max-w-[600px] mt-4 bg-white p-4 rounded-lg shadow flex justify-between items-center">
                <div id="status" class="font-semibold text-lg text-slate-700">准备开始...</div>
                <div id="timer" class="font-mono text-xl text-blue-600">00:00</div>
            </div>
        </div>

        <!-- 右侧：控制面板与分析 -->
        <div class="lg:w-1/3 space-y-6">
            
            <!-- 游戏设置 -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">对局设置</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">AI 难度</label>
                        <select id="difficulty" class="w-full border-gray-300 rounded-md shadow-sm p-2 border">
                            <option value="1">入门 (Depth 1)</option>
                            <option value="2">简单 (Depth 2)</option>
                            <option value="3" selected>中等 (Depth 3)</option>
                            <option value="4">困难 (Depth 4)</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-600">玩家阵营:</span>
                        <span id="player-color-badge" class="px-2 py-1 rounded text-xs font-bold bg-gray-200">随机</span>
                    </div>
                    <button onclick="app.startNewGame()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition">
                        开始新对局
                    </button>
                </div>
            </div>

            <!-- 实时分析 -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-lg font-bold mb-4 border-b pb-2"><i class="fas fa-chart-line mr-2"></i>局势解析</h2>
                
                <div class="mb-4">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase">当前开局</h3>
                    <p id="opening-name" class="text-lg font-medium text-indigo-600 mt-1">未识别</p>
                    <p id="opening-desc" class="text-sm text-gray-600 mt-1 italic">走棋以识别经典开局...</p>
                </div>

                <div class="mb-4">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase">局面评估</h3>
                    <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                        <div id="eval-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 50%"></div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-500 mt-1">
                        <span>黑方优势</span>
                        <span id="eval-score">0.0</span>
                        <span>白方优势</span>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-semibold text-gray-500 uppercase">走法历史 (PGN)</h3>
                    <textarea id="pgn-display" readonly class="w-full h-24 mt-2 p-2 text-xs font-mono bg-gray-50 border rounded resize-none"></textarea>
                </div>
            </div>

        </div>
    </main>

    <!-- 战绩模态框 -->
    <div id="history-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-2/3 lg:w-1/2 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900">历史对局记录</h3>
                <div class="mt-2 px-7 py-3">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">日期</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">结果</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">难度</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="history-list" class="bg-white divide-y divide-gray-200">
                            <!-- 动态插入 -->
                        </tbody>
                    </table>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="close-modal" onclick="app.toggleHistoryModal()" class="px-4 py-2 bg-gray-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-300">
                        关闭
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本引入 -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
